<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Modern analog clock</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>
     <div class="clock">
          <div id="time">
               <div class="circle circle-second">
                    <div class="dots sec-dot"></div>
                    <svg>
                         <circle id="ss" cx="120" cy="120" r="120"></circle>
                    </svg>
               </div>
               <div class="circle circle-minute">
                    <div class="dots min-dot"></div>
                    <svg>
                         <circle id="mm" cx="100" cy="100" r="100"></circle>
                    </svg>
               </div>
               <div class="circle circle-hour">
                    <div class="dots hr-dot"></div>
                    <svg>
                         <circle id="hh" cx="80" cy="80" r="80"></circle>
                    </svg>
               </div>
               <div class="needles needle-sec" id="sc">
                    <i></i>
               </div>

               <div class="needles needle-min" id="mn">
                    <i></i>
               </div>

               <div class="needles needle-hr" id="hr">
                    <i></i>
               </div>

               <span style="--i:1"><b>1</b></span>
               <span style="--i:2"><b>2</b></span>
               <span style="--i:3"><b>3</b></span>
               <span style="--i:4"><b>4</b></span>
               <span style="--i:5"><b>5</b></span>
               <span style="--i:6"><b>6</b></span>
               <span style="--i:7"><b>7</b></span>
               <span style="--i:8"><b>8</b></span>
               <span style="--i:9"><b>9</b></span>
               <span style="--i:10"><b>10</b></span>
               <span style="--i:11"><b>11</b></span>
               <span style="--i:12"><b>12</b></span>
          </div>
     </div>

     <script src="main.js"></script>
</body>

</html>
