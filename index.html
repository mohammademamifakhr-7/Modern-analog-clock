<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Modern analog clock</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>
     <div class="clock">
          <div id="time">
               <div class="circle circle-second">
                    <div class="dots sec-dot"></div>
                    <svg><circle id="ss" cx="120" cy="120" r="120"></circle></svg>
               </div>
               <div class="circle circle-minute">
                    <div class="dots min-dot"></div>
                    <svg><circle id="mm" cx="100" cy="100" r="100"></circle></svg>
               </div>
               <div class="circle circle-hour">
                    <div class="dots hr-dot"></div>
                    <svg><circle id="hh" cx="80" cy="80" r="80"></circle></svg>
               </div>
          </div>
     </div>

     <script src="main.js"></script>
</body>

</html>
