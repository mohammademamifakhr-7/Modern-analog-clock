<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Modern analog clock</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>
     <div class="clock">
          <div id="time">
               <div class="circle circle-second">
                    <div class="dots sec-dot"></div>
                    <svg viewBox="0 0 250 250" aria-hidden="true">
                         <circle id="ss" cx="125" cy="125" r="120"></circle>
                    </svg>
               </div>
               <div class="circle circle-minute">
                    <div class="dots min-dot"></div>
                    <svg viewBox="0 0 250 250" aria-hidden="true">
                         <circle id="mm" cx="125" cy="125" r="100"></circle>
                    </svg>
               </div>
               <div class="circle circle-hour">
                    <div class="dots hr-dot"></div>
                    <svg viewBox="0 0 250 250" aria-hidden="true">
                         <circle id="hh" cx="125" cy="125" r="80"></circle>
                    </svg>
               </div>
          </div>
     </div>

     <script src="main.js"></script>
</body>

</html>
